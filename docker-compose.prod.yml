version: '3.8'

# Configuração Docker Compose otimizada para Produção / VPS EasyPanel
services:
  wartune-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wartune_db_data:/var/lib/postgresql/data
    networks:
      - wartune-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wartune-server:
    build:
      context: ./wartune-reborne-emulator
      dockerfile: ../docker/server/Dockerfile
    restart: always
    depends_on:
      wartune-db:
        condition: service_healthy
    environment:
      WARTUNE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@wartune-db:5432/${POSTGRES_DB}
      WARTUNE_SERVER_ID: ${WARTUNE_SERVER_ID:-1}
      WARTUNE_SERVER_NAME: ${WARTUNE_SERVER_NAME:-S1 - Wartune Reborn}
      WARTUNE_SITE: ${WARTUNE_SITE:-local_0001}
      WARTUNE_BIND_HOST: 0.0.0.0
      WARTUNE_PUBLIC_HOST: ${WARTUNE_PUBLIC_HOST}
      WARTUNE_HTTP_PORT: 8080
      WARTUNE_SOCKET_PORT: 5000
      WARTUNE_WEBSOCKET_PORT: 5001
      WARTUNE_POLICY_PORT: 843
      WARTUNE_GAME_TIMEZONE: ${WARTUNE_GAME_TIMEZONE:-UTC}
      WARTUNE_SKIP_TUTORIAL: ${WARTUNE_SKIP_TUTORIAL:-false}
      WARTUNE_GM_SECRET: ${WARTUNE_GM_SECRET}
      WARTUNE_SITE_URL: ${WARTUNE_GAME_URL}
      WARTUNE_LOG_LEVEL: INFO
      WARTUNE_LOG_PACKETS: "false"
    ports:
      - "8080:8080"
      - "5000:5000"
      - "5001:5001"
      - "843:843"
    volumes:
      - wartune_server_data:/app/data
      - wartune_server_logs:/app/logs
    networks:
      - wartune-net

  wartune-portal:
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    restart: always
    depends_on:
      wartune-db:
        condition: service_healthy
    environment:
      WARTUNE_DB_DSN: pgsql:host=wartune-db;port=5432;dbname=${POSTGRES_DB}
      WARTUNE_DB_USER: ${POSTGRES_USER}
      WARTUNE_DB_PASS: ${POSTGRES_PASSWORD}
      WARTUNE_PORTAL_URL: ${WARTUNE_PORTAL_URL}
      WARTUNE_CDN_URL: ${WARTUNE_CDN_URL}
      WARTUNE_GAME_URL: ${WARTUNE_GAME_URL}
      WARTUNE_TICKET_TTL: 300
      WARTUNE_GM_SECRET: ${WARTUNE_GM_SECRET}
      WARTUNE_GM_USERS: ${WARTUNE_GM_USERS:-admin}
      WARTUNE_SITE_NAME: "Wartune Reborn"
    ports:
      - "80:80"
    networks:
      - wartune-net

  wartune-cdn:
    build:
      context: .
      dockerfile: docker/cdn/Dockerfile
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./CDN/res134-bmclas-sq.7road.net:/usr/share/nginx/html/res134-bmclas-sq.7road.net:ro
      - ./CDN/s134-bmclas-sq.7road.net:/usr/share/nginx/html/s134-bmclas-sq.7road.net:ro
    networks:
      - wartune-net

networks:
  wartune-net:
    driver: bridge

volumes:
  wartune_db_data:
  wartune_server_data:
  wartune_server_logs:
