server {
    listen 80;
    server_name _;
    root /opt/wartune-cdn/res134-bmclas-sq.7road.net;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    types {
        application/x-shockwave-flash swf bswf;
        text/xml xml;
        text/plain txt sq maps titles path rd;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        application/json json;
        audio/mpeg mp3;
        video/x-flv flv;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /crossdomain.xml {
        default_type text/xml;
        return 200 '<?xml version="1.0"?><cross-domain-policy><allow-access-from domain="*" /></cross-domain-policy>';
    }

    # Static fallback locations
    location = /empty.png {
        root /opt/wartune-cdn;
        try_files /empty.png =404;
        default_type image/png;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /empty.swf {
        root /opt/wartune-cdn;
        try_files /empty.swf =404;
        default_type application/x-shockwave-flash;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /empty.mp3 {
        root /opt/wartune-cdn;
        try_files /empty.mp3 =404;
        default_type audio/mpeg;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /empty.xml {
        root /opt/wartune-cdn;
        try_files /empty.xml =404;
        default_type text/xml;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.png\.png$ {
        rewrite ^(.*)\.png\.png$ $1.png last;
    }

    location /equip/ {
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files $uri @fallback_equip;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @fallback_equip {
        rewrite ^/equip/wing_[^/]+/(.*)$ /equip/wing_acehunter/$1 last;
        rewrite ^/equip/fashion_cloth_[^/]+/(.*)$ /equip/fashion_cloth_punk01/$1 last;
        rewrite ^/equip/fashion_hat_[^/]+/(.*)$ /equip/fashion_hat_bosi/$1 last;
        rewrite ^/equip/fashion_weapon_[^/]+/(.*)$ /equip/fashion_weapon_punk01/$1 last;
        try_files /opt/wartune-cdn/empty.swf =404;
        default_type application/x-shockwave-flash;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /equip_show/ {
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files $uri @fallback_equip_show;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @fallback_equip_show {
        rewrite ^/equip_show/mount_([^/]+)/1\.swf$ /equip_show/mount_$1/2.swf last;
        rewrite ^/equip_show/fashion_cloth_[^/]+/(.*)$ /equip_show/fashion_cloth_punk01/$1 last;
        rewrite ^/equip_show/fashion_weapon_[^/]+/(.*)$ /equip_show/fashion_weapon_punk01/$1 last;
        rewrite ^/equip_show/wing_[^/]+/(.*)$ /equip_show/wing_acehunter/$1 last;
        try_files /opt/wartune-cdn/empty.swf =404;
        default_type application/x-shockwave-flash;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Avatares de montaria: fallback de 1 para 2
    location ~* ^/swf/avatar/(?<mpart>mount_[^/]+)/1\.(?<mext>bswf|swf)$ {
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files /swf/avatar/$mpart/1.$mext /swf/avatar/$mpart/2.$mext @fallback_empty;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Avatares de chapéus: fallback de down para up
    location ~* ^/swf/avatar/(?<hpart>fashion_hat_[^/]+)down(?<hmnt>_mount)?/(?<hfile>.*)$ {
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files /swf/avatar/${hpart}down${hmnt}/$hfile /swf/avatar/${hpart}up${hmnt}/$hfile /swf/avatar/${hpart}/$hfile @fallback_empty;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Avatares gerais
    location ~* ^/swf/avatar/(?<part>[^/]+)/(?<file>.*)$ {
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files /swf/avatar/$part/$file /swf/avatar/${part}up/$file @fallback_empty;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Títulos: busca em /images/appell/ e fallback para /icon/appell/
    location ~* ^/images/appell/(?<icon_file>.*)$ {
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files /images/appell/$icon_file /icon/appell/$icon_file @fallback_empty;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Títulos: busca em /icon/appell/ e fallback para /images/appell/
    location ~* ^/icon/appell/(?<icon_file2>.*)$ {
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files /icon/appell/$icon_file2 /images/appell/$icon_file2 @fallback_empty;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Tiles de mapa: cache longo
    location /mapmaterial/ {
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Flash player sound request with empty URL
    location = /game/client/ {
        default_type audio/mpeg;
        alias /opt/wartune-cdn/empty.mp3;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /client/ {
        default_type audio/mpeg;
        alias /opt/wartune-cdn/empty.mp3;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /timestory {
        alias /opt/wartune-cdn/s134-bmclas-sq.7road.net/timestory/;
        index index.html index.xml;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # /game/ directory routes
    location /game/ {
        alias /opt/wartune-cdn/s134-bmclas-sq.7road.net/;
        try_files $uri @check_res;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @check_res {
        rewrite ^/game/(.*)$ /$1 break;
        root /opt/wartune-cdn/res134-bmclas-sq.7road.net;
        try_files $uri @fallback_empty;
    }

    location /cdn/ {
        alias /opt/wartune-cdn/res134-bmclas-sq.7road.net/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /s134-bmclas-sq.7road.net/ {
        alias /opt/wartune-cdn/s134-bmclas-sq.7road.net/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /res134-bmclas-sq.7road.net/ {
        alias /opt/wartune-cdn/res134-bmclas-sq.7road.net/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ @fallback_game;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @fallback_game {
        root /opt/wartune-cdn/s134-bmclas-sq.7road.net;
        try_files $uri $uri/ @fallback_empty;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @fallback_empty {
        add_header Access-Control-Allow-Origin "*" always;
        if ($uri ~* \.(png|jpg|jpeg|gif)$) {
            rewrite ^ /empty.png last;
        }
        if ($uri ~* \.(swf|bswf)$) {
            rewrite ^ /empty.swf last;
        }
        if ($uri ~* \.(mp3|wav|ogg)$) {
            rewrite ^ /empty.mp3 last;
        }
        if ($uri ~* \.xml$) {
            rewrite ^ /empty.xml last;
        }
        return 404;
    }
}
